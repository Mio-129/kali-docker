name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate Codespace configuration
      run: |
        python3 -m json.tool .devcontainer/devcontainer.json > /dev/null
        python3 -m json.tool .devcontainer/kali/devcontainer.json > /dev/null
        bash -n .devcontainer/setup-kali.sh
        if command -v shellcheck >/dev/null 2>&1; then shellcheck .devcontainer/setup-kali.sh; fi

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag kali-docker:$(date +%s)
